name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate update.json
        run: node scripts/gen-update.mjs

      - name: Verify outputs
        run: |
          echo "--- dist ---"
          ls -lh dist/
          test -f dist/update.json || (echo "::error::update.json missing" && exit 1)

      - name: Move release tag
        run: |
          git tag -f release
          git push -f origin release || echo "tag move skipped (no permission)"

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Latest Release
          body: |
            见 [CHANGELOG.md](https://github.com/MrBear9/zotero-smart-import/blob/main/CHANGELOG.md)。

            ## 安装

            1. 下载 `.xpi` 文件
            2. Zotero → 工具 → 插件 → 齿轮 → 从文件安装
            3. 重启 Zotero

            > 已配置 `update_url`，之后可在 Zotero 里自动更新。
          files: dist/*.xpi
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach update.json
        run: |
          gh release upload release dist/update.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
