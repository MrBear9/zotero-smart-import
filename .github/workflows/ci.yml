name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/dedupe/index.js
          node --check src/core/zotero-adapter.js
          node --check src/ui/dialog.js
          node --check src/menu/collection-menu.js

      - name: Build
        run: npm run build

      - name: Verify bundle
        run: |
          test -f build/bootstrap.js || (echo "bootstrap.js missing" && exit 1)
          test -f dist/*.xpi || (echo "xpi missing" && exit 1)
          # 确认没有残留 ES module 语法
          if grep -qE '^\s*(import|export)\s' build/bootstrap.js; then
            echo "bundled file still contains import/export"
            exit 1
          fi
          echo "bundle OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi
          retention-days: 7
